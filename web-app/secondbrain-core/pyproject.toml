[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secondbrain-core"
version = "0.1.0.dev0"
description = "SecondBrain modular monolith business service foundation"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.100", "uvicorn>=0.23", "httpx>=0.24", "python-multipart>=0.0.9,<1", "pypdf>=6.21.2,<7", "Pillow>=10,<12", "mutagen>=1.47,<2"]

[project.optional-dependencies]
test = ["httpx>=0.24", "pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["secondbrain_core*"]
