# Candidate only: not a production Compose file and not applied.
# Candidate HTTPS topology: DSM's existing reverse proxy terminates TLS and
# forwards directly to Core. Keep the upstream bound to NAS loopback.
services:
  secondbrain-core:
    build: .
    read_only: true
    # Current NAS Review/Knowledge owner is UID 1026, GID 100; reverify before deployment.
    user: "1026:100"
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    ports:
      - "127.0.0.1:9120:8000"
    environment:
      SB_REVIEW_ROOT: /review
      SB_KNOWLEDGE_ROOT: /knowledge
      SB_PROMOTE_STATE_ROOT: /var/lib/secondbrain-core
      SB_PROMOTE_UNLOCK_SECRET_FILE: /run/secrets/promote_unlock
      SB_DASHBOARD_ORIGINS: ${SB_DASHBOARD_ORIGINS:?set exact Dashboard origin}
      SB_CORE_ALLOWED_HOSTS: ${SB_CORE_ALLOWED_HOSTS:?set exact Core Host}
      SB_TRUSTED_PROXY_IPS: ${SB_TRUSTED_PROXY_IPS:?set exact DSM proxy peer IP}
      SB_PROMOTE_SESSION_TTL: "3600"
      # Stage A and deployment preflight stay fail-closed by default.
      SB_PROMOTE_ENABLED: "false"
    volumes:
      - type: bind
        source: ${REVIEW_ROOT:?set Review NAS path}
        target: /review
        read_only: true
      - type: bind
        source: ${KNOWLEDGE_ROOT:?set Knowledge NAS root}
        target: /knowledge
        read_only: false
      - type: bind
        source: ${CORE_STATE_ROOT:?set Core-only state directory}
        target: /var/lib/secondbrain-core
        read_only: false
      - type: bind
        source: ${CORE_UNLOCK_SECRET_FILE:?provision privately outside Hermes}
        target: /run/secrets/promote_unlock
        read_only: true

# Required corresponding Hermes mount change is a separate production diff:
# remove the 20-Knowledge RW submount and remove `/secondbrain-write` from
# HERMES_WRITE_SAFE_ROOT; retain the existing RO `/secondbrain` mount plus the
# separately scoped Inbox/Review capture mounts. This candidate does not encode
# or apply that production change.
