name: WP5 independent slash-menu DOM probe

on:
  push:
    branches:
      - codex/wp5-rich-page

permissions:
  contents: read

jobs:
  independent-chromium-dom-probe:
    if: github.repository == 'zxwan829/SecondBrain'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web-app/secondbrain-frontend/package-lock.json
            web-app/e2e/package-lock.json
      - name: Install isolated Core dependencies
        working-directory: web-app/secondbrain-core
        run: python -m pip install -e ".[test]"
      - name: Install frontend and Playwright dependencies
        run: |
          npm ci --prefix web-app/secondbrain-frontend
          npm ci --prefix web-app/e2e
      - name: Install Linux Chromium
        working-directory: web-app/e2e
        run: npx playwright install chromium
      - name: Run independent DOM and selection probe
        run: python web-app/e2e/scripts/wp5_slash_dom_probe.py
