name: D077 Hermes synthetic live memory evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d077-hermes-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-live-evaluation:
    # Never expose the private test secret to pull-request triggered code.
    if: github.repository == 'zxwan829/SecondBrain' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify isolated runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          docker info --format '{{.ServerVersion}}'
          df -h /
      - name: Pull fixed Hermes release image
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s docker pull --platform linux/amd64 \
            nousresearch/hermes-agent@sha256:a11574b7fe8e1631d7d88d556677dac693bc058abf558cdeb899155688c1bf05
      - name: Run synthetic real-model learning experiment
        shell: bash
        timeout-minutes: 15
        env:
          SILICONFLOW_D077_KEY: ${{ secrets.SILICONFLOW_D077_KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -B docs/benchmarks/d077-hermes-live/hermes_live_ci.py
      - name: Clean up temporary Docker assets
        if: always()
        shell: bash
        run: |
          docker rm -f d077-live-agent 2>/dev/null || true
          docker network rm d077-live-internal 2>/dev/null || true
