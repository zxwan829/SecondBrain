name: D077 Hermes and P4-2 Weixin isolated smoke

on:
  pull_request:
    paths:
      - .github/workflows/d077-hermes-smoke.yml
      - web-app/hermes-agent/patches/v0.22.2/**
      - web-app/hermes-agent/weixin-inbox/**
      - web-app/hermes-agent/tests/weixin_gateway_smoke.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d077-hermes-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-smoke:
    if: github.repository == 'zxwan829/SecondBrain'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout SecondBrain candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned Hermes v0.22.2 source
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: d923a5eb487a17c0a68801bba9ef0f56c81040a8
          path: hermes-agent-source
          persist-credentials: false

      - name: Show ephemeral runner capacity
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          df -h /
          docker version --format '{{.Server.Version}}'

      - name: Pull and inspect fixed upstream amd64 image
        shell: bash
        env:
          IMAGE: nousresearch/hermes-agent@sha256:a11574b7fe8e1631d7d88d556677dac693bc058abf558cdeb899155688c1bf05
        run: |
          set -euo pipefail
          timeout 240s docker pull --platform linux/amd64 "$IMAGE"
          docker image inspect "$IMAGE" --format 'OS={{.Os}} ARCH={{.Architecture}} ID={{.Id}}'
          test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = amd64

      - name: Run disposable offline nonroot container
        shell: bash
        env:
          IMAGE: nousresearch/hermes-agent@sha256:a11574b7fe8e1631d7d88d556677dac693bc058abf558cdeb899155688c1bf05
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 75s docker run --rm \
            --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            --tmpfs /opt/data:rw,nosuid,size=128m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 2g --cpus 1 --pids-limit 128 \
            --user 10001:10001 \
            --entrypoint /bin/sh "$IMAGE" -c '
              set -eu
              echo "CONTAINER_IDENTITY=$(id)"
              echo "PYTHON=$(command -v python3 || command -v python)"
              echo "NETWORK_INTERFACES:"
              cat /proc/net/dev
              if command -v python3 >/dev/null 2>&1; then python3 -V; else python -V; fi
              test -w /tmp
              test -w /opt/data
              echo "D077_SMOKE_PASS"
            '

      - name: Build the fixed Weixin image with network disabled
        shell: bash
        run: |
          set -euo pipefail
          web-app/hermes-agent/patches/v0.22.2/build-fixed-image.sh \
            "$GITHUB_WORKSPACE/hermes-agent-source" \
            "secondbrain-hermes:weixin-${GITHUB_SHA}"

      - name: Run synthetic Gateway and plugin smoke without network or secrets
        shell: bash
        env:
          IMAGE: secondbrain-hermes:weixin-${{ github.sha }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s docker run --rm \
            --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            --tmpfs /opt/data:rw,nosuid,size=128m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 2g --cpus 1 --pids-limit 128 --user 10001:10001 \
            --workdir /opt/hermes \
            --mount "type=bind,src=$GITHUB_WORKSPACE/web-app/hermes-agent/tests/weixin_gateway_smoke.py,dst=/tmp/weixin_gateway_smoke.py,readonly" \
            --entrypoint /bin/sh "$IMAGE" -ec \
            'if command -v python3 >/dev/null 2>&1; then python3 -B /tmp/weixin_gateway_smoke.py; else python -B /tmp/weixin_gateway_smoke.py; fi'
