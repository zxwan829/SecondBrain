name: Writer Linux native UID isolation (manual candidate)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  writer-linux-native-uid-isolation:
    if: github.repository == 'zxwan829/SecondBrain' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the reviewed #193 Linux test candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 02c8ad3d8fd40f0e3752c0748d677462fb88870c
          persist-credentials: false

      - name: Verify disposable runner and record kernel, filesystem, LSM, and capabilities
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$(id -u)" -ne 0
          command -v sudo >/dev/null
          command -v findmnt >/dev/null
          command -v unshare >/dev/null
          command -v python3.12 >/dev/null
          command -v setpriv >/dev/null
          command -v pivot_root >/dev/null
          printf 'runner_image=%s/%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          printf 'runner_environment=%s\n' "$RUNNER_ENVIRONMENT"
          printf 'kernel=%s\n' "$(uname -srmo)"
          printf 'fixed_test_source=02c8ad3d8fd40f0e3752c0748d677462fb88870c\n'
          python3.12 --version
          printf 'runner_tmp_mount='; findmnt -n -T /tmp -o TARGET,FSTYPE,OPTIONS
          if [ -r /sys/kernel/security/lsm ]; then
            printf 'lsm='; tr '\n' ' ' </sys/kernel/security/lsm; printf '\n'
          else
            printf 'lsm=unavailable\n'
          fi
          python3.12 - <<'PY'
          import ctypes
          import errno
          import platform

          machine = platform.machine().lower()
          syscall_number = 444 if machine in {"x86_64", "amd64", "aarch64", "arm64"} else None
          if syscall_number is None:
              print(f"landlock_abi=not_queried_unsupported_arch:{machine}")
          else:
              libc = ctypes.CDLL(None, use_errno=True)
              result = libc.syscall(syscall_number, None, 0, 1)
              if result >= 0:
                  print(f"landlock_abi={result}")
              else:
                  error = ctypes.get_errno()
                  print(f"landlock_abi=unavailable_errno:{error}:{errno.errorcode.get(error, 'UNKNOWN')}")
          PY
          printf 'runner_capabilities='; sudo --non-interactive awk '/^(CapPrm|CapEff|CapBnd):/ {printf "%s=%s ", $1, $2} END {print ""}' /proc/self/status

      - name: Install isolated test runner dependency
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -m venv "$RUNNER_TEMP/writer-linux-venv"
          PIP_NO_INPUT=1 "$RUNNER_TEMP/writer-linux-venv/bin/python" -m pip install --disable-pip-version-check --index-url https://pypi.org/simple --only-binary=:all: 'pytest==9.1.1'

      - name: Run native UID/GID Writer subset inside isolated VM namespaces
        working-directory: web-app/secondbrain-core
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_RUNTIME="$(python3.12 -c 'import sys; print(sys.prefix)')"
          SANDBOX_ROOT="$RUNNER_TEMP/writer-linux-sandbox-root"
          mkdir -p "$SANDBOX_ROOT"
          # Root is used only to configure isolated namespaces on a disposable VM.
          # The test runs after pivot_root, with network isolation and no CAP_SYS_ADMIN.
          sudo --non-interactive env -i \
            PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            SB_WRITER_OS_ISOLATION=disposable-linux \
            SB_WRITER_TEST_PYTHONPATH="$GITHUB_WORKSPACE/web-app/secondbrain-core" \
            PYTHONPATH="$GITHUB_WORKSPACE/web-app/secondbrain-core" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            PYTHON_RUNTIME="$PYTHON_RUNTIME" \
            SANDBOX_ROOT="$SANDBOX_ROOT" \
            TMPDIR=/tmp \
            PYTHON_BIN="$RUNNER_TEMP/writer-linux-venv/bin/python" \
            unshare --mount --net --ipc --uts --pid --fork --mount-proc --kill-child \
            bash -euo pipefail -c '
              mount --make-rprivate /
              mount -t tmpfs -o size=256m,mode=0755,nodev,nosuid tmpfs "$SANDBOX_ROOT"
              root="$SANDBOX_ROOT"
              mkdir -p "$root"/{usr,lib,lib64,opt,proc,tmp,var/tmp,dev/shm,run,etc,oldroot}
              mkdir -p "$root$GITHUB_WORKSPACE" "$root$RUNNER_TEMP/writer-linux-venv" "$root$PYTHON_RUNTIME"
              ln -s usr/bin "$root/bin"
              ln -s usr/sbin "$root/sbin"
              for path in /usr /lib /lib64; do
                if [ -e "$path" ]; then
                  mkdir -p "$root$path"
                  mount --bind "$path" "$root$path"
                  mount -o remount,bind,ro "$root$path"
                fi
              done
              mkdir -p "$root$(dirname "$PYTHON_RUNTIME")"
              mount --bind "$PYTHON_RUNTIME" "$root$PYTHON_RUNTIME"
              mount -o remount,bind,ro "$root$PYTHON_RUNTIME"
              mount --bind "$GITHUB_WORKSPACE" "$root$GITHUB_WORKSPACE"
              mount -o remount,bind,ro "$root$GITHUB_WORKSPACE"
              mount --bind "$RUNNER_TEMP/writer-linux-venv" "$root$RUNNER_TEMP/writer-linux-venv"
              mount -o remount,bind,ro "$root$RUNNER_TEMP/writer-linux-venv"
              for device in null zero random urandom; do
                : >"$root/dev/$device"
                mount --bind "/dev/$device" "$root/dev/$device"
                mount -o remount,bind,ro "$root/dev/$device"
              done
              mount -t tmpfs -o size=64m,mode=1777,nodev,nosuid,noexec tmpfs "$root/tmp"
              mount -t tmpfs -o size=16m,mode=1777,nodev,nosuid,noexec tmpfs "$root/var/tmp"
              mount -t tmpfs -o size=16m,mode=1777,nodev,nosuid,noexec tmpfs "$root/dev/shm"
              mount -t tmpfs -o size=4m,mode=0755,nodev,nosuid,noexec tmpfs "$root/run"
              mount -t proc -o nosuid,nodev,noexec proc "$root/proc"
              cd "$root"
              pivot_root . oldroot
              umount -l /oldroot
              rmdir /oldroot
              cd "$GITHUB_WORKSPACE/web-app/secondbrain-core"
              for required_command in findmnt find cat grep setpriv; do
                if ! command -v "$required_command" >/dev/null; then
                  printf "isolated_command_missing=%s\\n" "$required_command" >&2
                  exit 127
                fi
              done
              if [[ ! -x "$PYTHON_BIN" || ! -x "$PYTHON_RUNTIME/bin/python3.12" || ! -r "$RUNNER_TEMP/writer-linux-venv/pyvenv.cfg" ]]; then
                printf "isolated_python_runtime_incomplete\\n" >&2
                exit 127
              fi
              test "$(id -u)" -eq 0
              test "$(findmnt -n -T / -o FSTYPE)" = tmpfs
              test ! -e /oldroot
              test "$(findmnt -n -T /tmp -o FSTYPE)" = tmpfs
              workspace_options="$(findmnt -n -T "$GITHUB_WORKSPACE" -o OPTIONS)"
              case ",$workspace_options," in *,ro,*) ;; *) exit 1 ;; esac
              venv_options="$(findmnt -n -T "$RUNNER_TEMP/writer-linux-venv" -o OPTIONS)"
              case ",$venv_options," in *,ro,*) ;; *) exit 1 ;; esac
              printf "sandbox_root_mount="; findmnt -n -T / -o TARGET,FSTYPE,OPTIONS
              printf "test_scratch_mount="; findmnt -n -T /tmp -o TARGET,FSTYPE,OPTIONS
              printf "workspace_mount="; findmnt -n -T "$GITHUB_WORKSPACE" -o TARGET,FSTYPE,OPTIONS
              printf "venv_mount="; findmnt -n -T "$RUNNER_TEMP/writer-linux-venv" -o TARGET,FSTYPE,OPTIONS
              test -z "$(find /run /dev -type s -print -quit 2>/dev/null)"
              printf "native_uid_map\\n"; cat /proc/self/uid_map
              printf "native_gid_map\\n"; cat /proc/self/gid_map
              validate_native_id_map() {
                local map_path="$1" map_line="" map_inside="" map_outside="" map_count="" map_extra="" map_lines=0
                while IFS= read -r map_line || [[ -n "$map_line" ]]; do
                  ((map_lines += 1))
                  ((map_lines == 1)) || return 1
                  map_inside="" map_outside="" map_count="" map_extra=""
                  read -r map_inside map_outside map_count map_extra <<< "$map_line"
                  [[ -n "$map_inside" && -n "$map_outside" && -n "$map_count" && -z "$map_extra" ]] || return 1
                  [[ "$map_inside" =~ ^[0-9]+$ && "$map_outside" =~ ^[0-9]+$ && "$map_count" =~ ^[0-9]+$ ]] || return 1
                  [[ "$map_inside" == 0 && "$map_outside" == 0 ]] || return 1
                  (( ${#map_count} <= 10 )) || return 1
                  (( 10#$map_count >= 31007 )) || return 1
                done < "$map_path"
                ((map_lines == 1))
              }
              validate_native_id_map /proc/self/uid_map || { printf "invalid_uid_map\\n" >&2; exit 1; }
              validate_native_id_map /proc/self/gid_map || { printf "invalid_gid_map\\n" >&2; exit 1; }
              grep -E "^Cap(Prm|Eff|Bnd):" /proc/self/status
              test ! -e /run/host
              test ! -e /var/run/docker.sock
              # Keep CHOWN/SETUID/SETGID for synthetic native-identity tests,
              # but remove mount administration before executing checkout code.
              exec setpriv --bounding-set=-sys_admin --no-new-privs -- \
                "$PYTHON_BIN" -m pytest -q -p no:cacheprovider \
                tests/test_restricted_knowledge_writer_linux_os_isolation.py
            '
