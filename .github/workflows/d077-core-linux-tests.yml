name: D077 Core Linux tests

on:
  pull_request:
    paths:
      - "web-app/secondbrain-core/**"
      - ".github/workflows/d077-core-linux-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-linux-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Core test dependencies
        working-directory: web-app/secondbrain-core
        run: python -m pip install -e ".[test]"
      - name: Run full Core tests and static verification
        working-directory: web-app/secondbrain-core
        run: |
          python -m pytest -q tests
          python -m compileall -q secondbrain_core tests
          git diff --check
