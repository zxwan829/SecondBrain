name: D077 Hermes v0.21.5 + Core local stub

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d077-hermes-v0215-core-stub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-e2e:
    if: github.repository == 'zxwan829/SecondBrain'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout selected PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify runner and Docker
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          docker version --format 'Docker server {{.Server.Version}}'
          df -h "$RUNNER_TEMP"

      - name: Pull and verify immutable Hermes v0.21.5 image
        shell: bash
        env:
          IMAGE: nousresearch/hermes-agent@sha256:d4da4a40cd7a28aba983775d9fd31d94cbf153eeb0cb9e844d6d0f612b7c24db
        run: |
          set -euo pipefail
          timeout 240s docker pull --platform linux/amd64 "$IMAGE"
          docker image inspect "$IMAGE" --format 'OS={{.Os}} ARCH={{.Architecture}} ID={{.Id}} REV={{index .Config.Labels "org.opencontainers.image.revision"}}'
          test "$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = sha256:e1e87aec2e3f5b9863c127a0f21f3b3c237c8717c57c323c7184a49ca12a0df6
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = 749220ef0007f8d87bd1531f1c24b0fe93816385

      - name: Install isolated Core dependencies
        working-directory: web-app/secondbrain-core
        run: python -m pip install -e .

      - name: Build ephemeral Core peer image
        env:
          CORE_IMAGE: d077-v0215-core:${{ github.run_id }}-${{ github.run_attempt }}
        run: docker build --tag "$CORE_IMAGE" web-app/secondbrain-core

      - name: Run real Hermes API + Core BFF against deterministic local stub
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: timeout --signal=TERM --kill-after=10s 16m python tests/d077/hermes_v0215_core_stub_ci.py

      - name: Clean only this run's labeled test assets
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CORE_IMAGE: d077-v0215-core:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mapfile -t containers < <(docker ps -aq --filter 'label=d077.issue=7' --filter "label=d077.run=$RUN_ID-$RUN_ATTEMPT")
          if ((${#containers[@]})); then docker rm -f "${containers[@]}"; fi
          mapfile -t networks < <(docker network ls -q --filter 'label=d077.issue=7' --filter "label=d077.run=$RUN_ID-$RUN_ATTEMPT")
          if ((${#networks[@]})); then docker network rm "${networks[@]}"; fi
          if docker image inspect "$CORE_IMAGE" >/dev/null 2>&1; then docker image rm "$CORE_IMAGE"; fi
