name: A Web synthetic browser acceptance

on:
  workflow_dispatch:
    inputs:
      wp5_open_only:
        description: Run isolated Linux Chromium DOM and Yjs diagnostic for archived table cell editing
        required: false
        type: boolean
        default: false
      wp5_roundtrip_only:
        description: Run only the desktop Notes save/reopen and conflict-autosave probe
        required: false
        type: boolean
        default: false
      wp5_rich_page_mode_only:
        description: Run only the desktop rich Page edit/save/reopen and Page/Edgeless mode round trip
        required: false
        type: boolean
        default: false
      wp5_archive_ux_only:
        description: Run only the desktop synthetic Rich Page archived UX interaction journey
        required: false
        type: boolean
        default: false
      wp5_conflict_only:
        description: Run only the desktop Notes conflict-autosave and recovery probe
        required: false
        type: boolean
        default: false
      wp5_desktop_only:
        description: Run the existing synthetic acceptance journey at desktop 1440x1000 only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: a-web-playwright-synthetic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-browser:
    if: github.repository == 'zxwan829/SecondBrain' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checked out event SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "CHECKOUT_SHA=$actual_sha"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web-app/secondbrain-frontend/package-lock.json
            web-app/e2e/package-lock.json
      - name: Install isolated Core dependencies
        working-directory: web-app/secondbrain-core
        run: python -m pip install -e ".[test]"
      - name: Install frontend and test dependencies
        run: |
          npm ci --prefix web-app/secondbrain-frontend
          npm ci --prefix web-app/e2e
      - name: Install Linux Chromium
        working-directory: web-app/e2e
        # Avoid apt repository updates; browser launch below verifies runtime deps.
        run: npx playwright install chromium
      - name: Run Web regression and type checks
        if: inputs.wp5_open_only != true
        working-directory: web-app/secondbrain-frontend
        env:
          WP5_ROUNDTRIP_ONLY: ${{ inputs.wp5_roundtrip_only || inputs.wp5_open_only }}
          WP5_CONFLICT_ONLY: ${{ inputs.wp5_conflict_only }}
          WP5_RICH_PAGE_MODE_ONLY: ${{ inputs.wp5_rich_page_mode_only }}
          WP5_ARCHIVE_UX_ONLY: ${{ inputs.wp5_archive_ux_only }}
        run: |
          if [ "$WP5_ROUNDTRIP_ONLY" = "true" ] || [ "$WP5_CONFLICT_ONLY" = "true" ] || [ "$WP5_RICH_PAGE_MODE_ONLY" = "true" ] || [ "$WP5_ARCHIVE_UX_ONLY" = "true" ]; then
            npm test -- --run src/NotesPage.test.tsx src/App.navigation.test.tsx src/blocksuite-markdown.test.ts src/zod-security.test.ts src/api/notes-blocksuite-blobs.test.ts src/rich-page-projection.test.ts src/plain-markdown-format-guard.test.ts
          else
            npm test
          fi
          npm run test:blocksuite-lifecycle
          npm run typecheck
      - name: Build Web assets
        working-directory: web-app/secondbrain-frontend
        env:
          VITE_ENABLE_NOTES: "true"
        run: npm run build
      - name: Verify trace artifact redaction
        if: inputs.wp5_open_only != true
        run: python -m pytest -q web-app/e2e/tests/test_artifact_sanitizer.py
      - name: Run independent WP5 table DOM diagnostic
        if: inputs.wp5_open_only == true
        env:
          SB_E2E_PRODUCTION_BUILD: "true"
          WP5_EXACT_SPEC_DIAGNOSTIC: "true"
        run: node web-app/e2e/scripts/wp5_table_dom_diagnostic.mjs
      - name: Run isolated Core + Web browser acceptance
        id: synthetic
        if: inputs.wp5_open_only != true
        env:
          WP5_ROUNDTRIP_ONLY: ${{ inputs.wp5_roundtrip_only || inputs.wp5_open_only }}
          WP5_CONFLICT_ONLY: ${{ inputs.wp5_conflict_only }}
          WP5_RICH_PAGE_MODE_ONLY: ${{ inputs.wp5_rich_page_mode_only }}
          WP5_ARCHIVE_UX_ONLY: ${{ inputs.wp5_archive_ux_only }}
          SB_E2E_PRODUCTION_BUILD: "true"
          SB_E2E_WP5_OPEN_ONLY: ${{ inputs.wp5_open_only }}
          WP5_DESKTOP_ONLY: ${{ inputs.wp5_desktop_only }}
        run: |
          if [ "$WP5_CONFLICT_ONLY" = "true" ]; then
            python web-app/e2e/scripts/run_synthetic_ci.py --wp5-conflict-only
          elif [ "$WP5_RICH_PAGE_MODE_ONLY" = "true" ]; then
            python web-app/e2e/scripts/run_synthetic_ci.py --wp5-rich-page-mode-only
          elif [ "$WP5_ARCHIVE_UX_ONLY" = "true" ]; then
            python web-app/e2e/scripts/run_synthetic_ci.py --wp5-archive-ux-only
          elif [ "$WP5_ROUNDTRIP_ONLY" = "true" ]; then
            python web-app/e2e/scripts/run_synthetic_ci.py --wp5-roundtrip-only
          elif [ "$WP5_DESKTOP_ONLY" = "true" ]; then
            python web-app/e2e/scripts/run_synthetic_ci.py --desktop-only
          else
            python web-app/e2e/scripts/run_synthetic_ci.py
          fi
      - name: Upload sanitized acceptance evidence
        if: always() && steps.synthetic.outputs.artifacts_verified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a-web-playwright-synthetic-${{ github.run_id }}
          # The run-specific directory is uploaded only after the runner emits
          # a success output following allowlist + redaction + leak validation.
          path: web-app/e2e/artifacts-sanitized/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
          retention-days: 7
